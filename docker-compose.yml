services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ocr_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ocr_db"]
      interval: 5s
      timeout: 5s
      retries: 20

  ocr-service:
    build:
      context: ./ocr-service
    environment:
      OCR_API_KEY: internal-ocr-secret
      OCR_LANG: en
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')",
        ]
      interval: 20s
      timeout: 10s
      retries: 10

  backend:
    build:
      context: ./backend
    command: >
      sh -c "pip install --no-cache-dir -r requirements.txt &&
      alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_NAME: OCR Document Platform
      ENVIRONMENT: development
      API_V1_PREFIX: /api/v1
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/ocr_db
      JWT_SECRET_KEY: change-me-in-production
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      OCR_PROVIDER: local
      OCR_API_URL: http://ocr-service:8080/extract
      OCR_API_KEY: internal-ocr-secret
      MAX_UPLOAD_SIZE_MB: 10
      ALLOWED_ORIGINS: http://localhost:3000
      STORE_RAW_OCR_TEXT: "true"
      EXTRACTION_VERSION: v1
      HTTP_TIMEOUT_SECONDS: 20
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:

